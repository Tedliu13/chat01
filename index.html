<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>領航員API測試台</title>
  <style>
    body { font-family: "Helvetica", sans-serif; background: #f5f5f5; padding: 20px; max-width: 800px; margin: auto; }
    textarea { width: 100%; height: 80px; font-size: 16px; padding: 10px; }
    button { margin-top: 10px; padding: 10px 20px; font-size: 16px; }
    .chat-box { white-space: pre-wrap; background: #fff; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid #ccc; }
    .sources { font-size: 13px; color: #555; margin-top: 8px; }
    .sources ul { margin: 6px 0 0 18px; }
  </style>
</head>
<body>
  <h2>領航員API測試台</h2>
  <textarea id="input" placeholder="請輸入氣候變遷調適相關問題..."></textarea>
  <br />
  <button onclick="askAI()">送出</button>

  <div class="chat-box" id="response">等等我就會告訴你...</div>
  <div class="sources" id="sources"></div>

  <script>
    // 產生一次性的 session_id，讓後端可關聯同一輪對話（若你不需要可拿掉）
    const sessionId = self.crypto?.randomUUID ? crypto.randomUUID() : String(Date.now());

    async function askAI() {
      const userInput = document.getElementById("input").value.trim();
      const responseBox = document.getElementById("response");
      const sourcesBox = document.getElementById("sources");
      sourcesBox.innerHTML = "";
      if (!userInput) {
        responseBox.textContent = "請先輸入內容喔～";
        return;
      }

      responseBox.textContent = "⏳ 請稍候...";
      const prefix = "";
      const question = prefix + userInput;

      try {
        const res = await fetch("https://assistant1-production.up.railway.app/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
            // 如果你在後端加了 API 金鑰驗證，這裡加上：
            // "X-API-Key": "你的公開用API金鑰"
          },
          body: JSON.stringify({
            question,
            session_id: sessionId
          })
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(`HTTP ${res.status}: ${text}`);
        }

        const data = await res.json();
        responseBox.textContent = data.answer || "⚠️ 沒有回應內容。";

        // 顯示來源（如果後端有提供）
        if (Array.isArray(data.sources) && data.sources.length) {
          const list = data.sources.map(s => `<li>${escapeHtml(String(s))}</li>`).join("");
          sourcesBox.innerHTML = `<div>參考來源：</div><ul>${list}</ul>`;
        }
      } catch (err) {
        console.error(err);
        responseBox.textContent = "❌ 發生錯誤，請檢查伺服器是否正常。";
      }
    }

    // 簡易 XSS 防護
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>


</body>
</html>
